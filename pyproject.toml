[project]
name = "relational-linkage-audit"
version = "0.1.0"
description = "Conditional bounds for relational queries over candidate identity assignments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.16.3",
    "matplotlib==3.10.3",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkage_bounds"]

[dependency-groups]
validation = [
    "highspy==1.15.1",
]
